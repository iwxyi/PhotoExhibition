      服务:
        - "PhotoAIScoringService"
        - "SceneRecognitionService"
        - "EmotionAnalysisService"
        - "SubjectDetectionService"
        - "SaliencyDetectionService"
        - "ColorAnalysisService"
        - "SmartTagService"
        - "SimilarPhotoSearchService"
