        - "自动放宽条件：无结果时逐步回退条件"
        - "结构化建议动作：前端可直接渲染为可点击建议"
        - "隐藏内容屏蔽：前台检索不会泄露隐藏资源"
        - "时间语义归一：把去年/前年等口语时间统一成可执行区间"
        - "搜索状态接口：前端可感知 AI 搜索可用性与状态"

