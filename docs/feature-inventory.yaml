        - "色彩分析：提取主色与调色板"
        - "智能标签：根据图像内容自动补标签"
        - "相似照片搜索：按颜色、标签、人脸等线索找相近照片"
    AI搜索:
      页面:
        - "frontend/src/views/Search.vue"
        - "frontend/src/components/SearchSpotlight.vue"
      API:
        - "GET /photos/ai-search"
        - "POST /photos/ai-search/execute"
        - "GET /photos/ai-search/status"
      服务:
        - "AiSearchService"
      功能点:
        - "自然语言搜索入口：允许用户直接输入口语化检索语句"
        - "零 AI 直搜 + AI 规划双路径：简单问题走快路径，复杂问题走规划路径"
        - "simple_search / simple_answer / analysis 查询分层：为速度与能力做分级处理"
        - "must / should / mustNot 结构化意图：把自然语言转成布尔检索条件"
