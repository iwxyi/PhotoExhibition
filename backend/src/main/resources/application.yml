server:
  port: 6060
  address: 0.0.0.0  # 监听所有网络接口，允许外部访问
  servlet:
    context-path: /api
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: -1

spring:
  application:
    name: photo-exhibition-backend
  servlet:
    multipart:
      enabled: true
      max-file-size: 1024MB
      max-request-size: 1024MB
  mvc:
    async:
      request-timeout: 600000
  
  datasource:
    # H2 配置 (默认，适合开发和简单部署)
    # driver-class-name: org.h2.Driver
    # url: jdbc:h2:file:./data/photo_exhibition;DB_CLOSE_ON_EXIT=FALSE
    # username: sa
    # password: ""

    # MySQL 配置 (生产环境推荐，取消注释下面的配置并注释掉上面的H2配置)
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/photo_exhibition?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: iwxyiroot
    
    hikari:
      # 连接池大小
      maximum-pool-size: 20
      minimum-idle: 5
      
      # 连接超时设置
      connection-timeout: 30000  # 30秒
      idle-timeout: 600000       # 10分钟
      max-lifetime: 1800000      # 30分钟 (比MySQL wait_timeout短)
      
      # 连接测试
      validation-timeout: 5000
      leak-detection-threshold: 60000
      
      # 连接保持
      keepalive-time: 300000     # 5分钟
  # H2数据库控制台（开发环境可访问 http://localhost:6060/api/h2-console）
  # h2:
  #   console:
  #     enabled: true
  #     path: /h2-console
  #     settings:
  #       web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        # H2方言 (切换到H2时启用)
        # dialect: org.hibernate.dialect.H2Dialect
        # MySQL方言 (切换到MySQL时启用)
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false

# Redis配置（可选，如果没有Redis服务会自动禁用）
# 如果Redis不可用，应用会使用内存缓存

# 日志配置
logging:
  level:
    root: INFO
    com.photoexhibition: DEBUG
    com.photoexhibition.service.SubjectDetectionService: DEBUG
    com.photoexhibition.service.PhotoScanService: DEBUG
    com.photoexhibition.service.AlbumService: INFO
    org.springframework: WARN
    org.springframework.web: INFO
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    com.zaxxer.hikari: WARN
    org.apache.tomcat: WARN
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
  
  # Redis配置（可选，如果没有Redis服务会自动禁用）
  # 如果Redis不可用，应用会使用内存缓存
  redis:
    host: disabled  # 设置为disabled以使用内存缓存
    port: 6379
    password:
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  # 缓存配置
  cache:
    type: caffeine  # 使用Caffeine作为缓存实现
  caffeine:
    spec: maximumSize=1000,expireAfterWrite=1h  # 最多缓存1000个评分结果，1小时过期

# 文件扫描配置
photo:
  scan:
    # 监控的图片目录（支持绝对路径和相对路径）
    # 相对路径：相对于项目根目录，例如：./data/photos 或 data/photos
    # 绝对路径：例如：/Users/你的用户名/Pictures 或 /data/photos
    base-path: ./data/photos
    # 支持的图片格式
    supported-formats: jpg,jpeg,png,heic,raw,cr2,nef,arw
    # 缩略图尺寸配置
    thumbnail:
      # 小缩略图：用于压缩封面的缩略图和PhotoViewer下面的缩略图列表
      small:
        width: 540
        height: 540
        quality: 0.85
      # 中缩略图：用于各种瀑布流（图墙、随机、相册详情的图片）的照片
      medium:
        width: 720
        height: 720
        quality: 0.90
      # 大缩略图：点击图片查看大图（PhotoViewer中未打开原图时看的大图），清晰度高
      large:
        width: 1920
        height: 1920
        quality: 0.95
        # 大缩略图如果无法进一步压缩则不生成，使用原图
        skip-if-no-benefit: true
    # 兼容性：原有缩略图配置（现用于小缩略图）
    thumbnail-width: 400
    thumbnail-height: 400
    # WebP质量
    webp-quality: 0.85
    # 自动扫描间隔（秒）
    scan-interval: 3600
    # 扫描时自动进行背景移除（生成透明背景人物图）
    auto-background-removal: true

# 文件上传配置
file:
  upload:
    max-size: 50MB
    allowed-types: image/jpeg,image/png,image/heic,image/raw

# JWT配置
jwt:
  secret: photo-exhibition-secret-key-change-in-production-environment
  expiration: 86400000 # 24小时（毫秒）

# 人脸识别配置
face:
  # 人脸检测模型配置（ONNX格式，如RetinaFace）
  detection:
    enabled: true  # 重新启用ONNX人脸检测，现在有ARM64支持了
    model-path: ./models/face_detection.onnx  # 检测模型路径
    confidence-threshold: 0.4  # 检测置信度阈值，降低以检测更多小人脸
    nms-threshold: 0.4  # 非极大值抑制阈值
    input-size: 640  # 模型输入尺寸（RetinaFace 常用 640）
    allow-simple-fallback: false  # 是否允许回退到简单肤色检测（建议准确率优先时关闭）
  # 人脸过滤配置（用于FaceService二次筛选），可按需要调整
  filters:
    min-area: 0.001   # 最小面积（相对整图），降低到0.1%以支持小人脸检测
    max-area: 0.8    # 最大面积（相对整图），默认 50%
    max-width: 0.75    # 最大宽度占比，默认 50%
    max-height: 0.75   # 最大高度占比，默认 50%
    min-ratio: 0.4    # 最小宽高比 w/h
    max-ratio: 2.5    # 最大宽高比 w/h
    max-faces-per-image: 36  # 单张图片最多保存人脸数
  # 人脸特征提取模型配置（用于识别）
  embedding:
    model-path: ./models/face_recognition.onnx  # 特征提取模型路径（R50/R100等）
  clustering:
    default-threshold: 0.6  # 聚类阈值默认 0.7，未在UI设置时使用
    # 以下为可配置的聚类策略（可根据需求放宽或关闭严格校验）
    threshold-bonus: 0.05       # 在用户阈值基础上额外增加的偏移量。默认0.05
    min-threshold: 0.10         # 聚类最低阈值（防止过低导致误合并），可调低以更宽松
    min-matches: 3              # 大组多点验证：至少匹配的成员数
    min-group-size: 3           # 多少成员以上按“大组”规则，多点+统计
    require-multi-point: true   # 是否开启多点验证（匹配若干成员才允许加入）
    require-stats: true         # 是否开启统计指标校验（均值/中位/75分位/最小相似度）
    small-group-strict: true    # 小组（成员数 < min-group-size）是否启用严格模式
    min-sim-slack-small: 0.03   # 小组最小相似度允许的放宽值
    min-sim-slack-large: 0.05   # 大组最小相似度允许的放宽值

# 智能标签配置
smart-tag:
  # 图像分类模型配置（ONNX格式，用于场景和物体识别）
  classification:
    enabled: true  # 重新启用ONNX图像分类
    model-path: ./models/image_classification.onnx  # 分类模型路径（如ResNet、EfficientNet等）
    confidence-threshold: 0.5  # 分类置信度阈值（0-1），低于此值的标签将被过滤。建议值：0.3(宽松) 0.5(平衡) 0.7(严格)
    top-k: 5  # 返回top-k个最可能的分类结果。如果启用strict-top-k，会强制返回前k个（忽略置信度阈值）
    strict-top-k: false  # 是否强制返回top-k个结果（忽略置信度阈值）。false=先过滤再取top-k（推荐），true=强制前k个
    language: zh  # 标签语言：zh(中文) 或 en(英文)，默认zh
  # 主体检测配置（用于焦点框显示和智能裁切）
  subject-detection:
    strategy: hybrid  # 检测策略：hybrid(混合策略，推荐) | face-first(人脸优先) | exif-first(EXIF优先) | visual-only(仅视觉)
    face-weight: 2.0  # 人脸权重倍数（当检测到人脸时，人脸区域的兴趣度会乘以此值）
    # ONNX显著性检测模型配置（可选，启用后优先使用深度学习模型）
    saliency:
      enabled: true  # 重新启用ONNX显著性检测
      model-path: ./models/saliency_detection.onnx  # 显著性检测模型路径（如U²-Net、BASNet等）
      input-size: 1024  # 模型输入尺寸，RMBG-1.4使用1024x1024，U²-Net Lite使用320x320

# AI图片评分配置
# AI图片评分配置
ai:
  scoring:
    enabled: true  # 启用AI评分功能
    version: 1.0
    technical-weight: 0.40
    composition-weight: 0.35
    appeal-weight: 0.25

  # 场景识别配置
  scene-recognition:
    enabled: false  # 暂时禁用，等待模型文件
    model-path: ./models/scene_recognition.onnx
    confidence-threshold: 0.3

  # 情感分析配置
  emotion-analysis:
    enabled: false  # 暂时禁用，等待模型文件
    model-path: ./models/emotion_analysis.onnx
    confidence-threshold: 0.3

# 背景移除配置 (用于人物抠图，创建立体封面效果)
background:
  removal:
    enabled: true  # 设为 true 启用背景移除功能
    model-path: ./models/briaai_rmbg.onnx  # BriaAI RMBG 模型路径
    cpu-threads: 4  # CPU 推理线程数
    keep-size: 1024  # 模型输入尺寸（BriaAI RMBG 推荐 1024）
    output-max-size: 720  # 输出图片最大尺寸（宽度或高度），用于优化文件大小
    threshold-transparent: 0.60  # 提高阈值，更严格去除背景（0-1）
    threshold-solid: 0.90  # 主体更实（0-1）
    erode-radius: 3  # 增大腐蚀半径，去除边缘噪点（0-5）
    blur-radius: 2  # 减小模糊，平滑边缘（0-5）
    concurrent-tasks: 1  # 并发处理任务数（1=串行处理，更省性能）